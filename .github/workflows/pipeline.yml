name: Pipeline

# One pipeline: every push and pull request is checked; a pushed v* tag is then released.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pinned so a CLI release cannot turn main red; bump it together with the contract test.
      - run: npm install -g @fission-ai/openspec@1.8.0
      # Fails without the CLI, so the contract test cannot silently skip.
      - run: openspec --version
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh scripts/build.sh
      - if: runner.os == 'Linux'
        run: shellcheck scripts/build.sh

  release:
    # Only for v* tags, and only once the checks above passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check the tag against the manifest version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v h="## $VERSION - " '/^## / { on = index($0, h) == 1; next } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Build the binaries
        run: |
          for os in darwin linux; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/kanban-$os-$arch" ./cmd/kanban
            done
          done
          cd dist
          sha256sum kanban-* > checksums.txt
          git rev-parse HEAD > commit.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Install from the release
        run: |
          out=$(sh scripts/build.sh)
          test "$out" = "downloaded kanban $VERSION"
          test "$(bin/kanban --version)" = "$VERSION"
